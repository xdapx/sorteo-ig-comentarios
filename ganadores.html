<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo · Kartings eléctricos · Ekart Track</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:linear-gradient(180deg,rgba(6,8,16,.72),rgba(6,8,16,.86)),url('fondo.jpg') center/cover fixed no-repeat;
  }
  .wrap{max-width:820px;margin:0 auto;padding:40px 18px 70px;min-height:100vh;
    display:flex;flex-direction:column;}
  h1{text-align:center;font-size:clamp(23px,5vw,36px);font-weight:900;line-height:1.15;
    letter-spacing:-.4px;text-shadow:0 3px 22px rgba(0,0,0,.7);margin-bottom:6px;}
  h1 .hl{color:#5cc8ff;}
  .center{text-align:center;margin-top:26px;}
  .btn-main{display:inline-flex;align-items:center;gap:11px;cursor:pointer;border:0;
    font-size:20px;font-weight:800;color:#08101c;padding:17px 34px;border-radius:15px;
    background:linear-gradient(100deg,#7cf0ff,#39a0ff);box-shadow:0 14px 40px -10px #2ba7ff;
    transition:transform .1s, filter .2s;}
  .btn-main:hover{filter:brightness(1.08);} .btn-main:active{transform:scale(.97);}
  .btn-main:disabled{opacity:.6;cursor:default;}
  .section-lbl{text-align:center;font-size:14px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
    margin:30px 0 14px;color:#cfe4ff;text-shadow:0 2px 12px rgba(0,0,0,.6);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;}
  .card{background:rgba(15,20,33,.82);border:1px solid rgba(255,255,255,.12);border-radius:13px;
    padding:15px 14px;display:flex;align-items:center;gap:11px;min-height:62px;
    backdrop-filter:blur(3px);overflow:hidden;}
  .card .rank{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;
    font-size:13px;font-weight:800;color:#cbd5e6;background:rgba(255,255,255,.12);}
  .card .name{font-weight:700;font-size:15px;word-break:break-all;}
  .card.spin .name{color:#8b93a6;opacity:.75;}
  .card.won{animation:pop .45s cubic-bezier(.2,1.3,.5,1);}
  .card.gold{border-color:#ffd35c;background:linear-gradient(180deg,rgba(255,196,60,.20),rgba(15,20,33,.86));}
  .card.gold .rank{color:#3a2a00;background:linear-gradient(100deg,#ffd35c,#ff9e2c);}
  .card.silver{border-color:#9fb6d6;background:linear-gradient(180deg,rgba(159,182,214,.16),rgba(15,20,33,.86));}
  .card.silver .rank{color:#10203a;background:linear-gradient(100deg,#dfe9f7,#9fb6d6);}
  @keyframes pop{0%{transform:scale(.8);opacity:.4;}100%{transform:scale(1);opacity:1;}}
  .foot{margin-top:auto;padding-top:28px;text-align:center;}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .btn-ghost{cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(15,20,33,.6);color:#fff;
    padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;backdrop-filter:blur(3px);}
  .seed{margin-top:14px;font-size:11px;color:rgba(255,255,255,.5);}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sorteo · 8 pares de entradas para kartings eléctricos en <span class="hl">Ekart Track</span></h1>

  <div class="center">
    <button id="go" class="btn-main">🎲 Sortear ganadores</button>
  </div>

  <div id="ganLbl" class="section-lbl hidden">🏆 8 Ganadores</div>
  <div id="ganGrid" class="grid"></div>

  <div id="supLbl" class="section-lbl hidden">🎗️ 6 Suplentes</div>
  <div id="supGrid" class="grid"></div>

  <div class="foot">
    <div id="acciones" class="row hidden">
      <button id="copy" class="btn-ghost">📋 Copiar lista</button>
      <button id="again" class="btn-ghost">🔄 Sortear de nuevo</button>
    </div>
    <div id="seed" class="seed hidden"></div>
  </div>
</div>

<script>
"use strict";
// 36 candidatos: usuarios con comentarios de menos likes (0) en el reel del sorteo de kartings
const POOL = ["_marquinio_","abrublejman_","ailuuacevedo","anmansilla_","aracriana","arielaitta","axel.torres4","beliciiosa","buenosvinossocialclub","cande.dz","ceciibongiorno","cepeda_home0","chemarianook","chula.38","ciubizflorenciacecilia","dulce.megami.007","dulcepatitook","elpupicastro","florestacharito","gonzalo.a.giammarino","ignacio83795","imiglioricani09","jeanigarcia","lu.sampieri","macarinajuliana","magaschett","meraki.vnc","mis.apuntes.faq","nan0mecanica","press_on_listas_","shessamy","snow.bloody_","sxbriina___","tomassl769","trendycs_","whoisaty"];
const N_GAN = 8, N_SUP = 6;

const $ = id => document.getElementById(id);
const go = $("go");

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function elegir(seed, n){
  const rng = mulberry32(seed), arr = POOL.slice();
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr.slice(0, n);
}

let ganadores = [], suplentes = [];

function armarCards(grid, cantidad, clase){
  grid.innerHTML = "";
  const cards = [];
  for(let i=0;i<cantidad;i++){
    const c = document.createElement("div");
    c.className = "card spin";
    c.innerHTML = `<span class="rank">${i+1}</span><span class="name">@…</span>`;
    grid.appendChild(c); cards.push(c);
  }
  return cards;
}
function animar(cards, nombres, clase, inicio, cb){
  const timers = cards.map(c=>{
    const n = c.querySelector(".name");
    return setInterval(()=>{ n.textContent = "@" + POOL[Math.floor(Math.random()*POOL.length)]; }, 65);
  });
  cards.forEach((c,i)=>{
    setTimeout(()=>{
      clearInterval(timers[i]);
      c.classList.remove("spin"); c.classList.add("won", clase);
      c.querySelector(".name").textContent = "@" + nombres[i];
      if(i===cards.length-1 && cb) setTimeout(cb, 300);
    }, inicio + i*250);
  });
}

function sortear(){
  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  const todos = elegir(seed, N_GAN + N_SUP);
  ganadores = todos.slice(0, N_GAN);
  suplentes = todos.slice(N_GAN, N_GAN + N_SUP);

  go.disabled = true;
  $("acciones").classList.add("hidden"); $("seed").classList.add("hidden");
  $("supLbl").classList.add("hidden");

  $("ganLbl").classList.remove("hidden");
  const gCards = armarCards($("ganGrid"), N_GAN, "gold");
  animar(gCards, ganadores, "gold", 1100, ()=>{
    // luego los suplentes
    $("supLbl").classList.remove("hidden");
    const sCards = armarCards($("supGrid"), N_SUP, "silver");
    animar(sCards, suplentes, "silver", 500, ()=>{
      $("seed").textContent = "🔐 Semilla: " + seed + " · " + new Date().toLocaleString("es-AR");
      $("seed").classList.remove("hidden");
      $("acciones").classList.remove("hidden");
      go.disabled = false; go.textContent = "🎲 Sortear otra vez";
    });
  });
}

go.onclick = sortear;
$("again").onclick = sortear;
$("copy").onclick = () => {
  const txt = "GANADORES:\n" + ganadores.map((g,i)=>`${i+1}. @${g}`).join("\n") +
              "\n\nSUPLENTES:\n" + suplentes.map((g,i)=>`${i+1}. @${g}`).join("\n");
  navigator.clipboard.writeText(txt);
  const b = $("copy"); b.textContent = "✅ Copiado"; setTimeout(()=>b.textContent="📋 Copiar lista", 1600);
};
</script>
</body>
</html>
