<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sorteo del Alpine · @damiancivale</title>
<style>
/* Tema oscuro, a propósito y en un solo sentido: no sigue al sistema. Los neutros llevan una
   pizca de azul para que peguen con el acento y no queden grises de fábrica. */
:root{
  --bg:#0b0f17; --card:#141a25; --border:#26303f; --txt:#e9eef7;
  --muted:#94a2b8; --accent:#4d9bff; --accent2:#2a7ae4; --ok:#3ecf8e; --warn:#e8b04b; --err:#f4736f;
  --gold:#f0c04a; --gold-bg:#221c0d; --gold-bd:#7d611f;
  --silver:#c2cdde; --silver-bg:#1a212d; --silver-bd:#364255;
  --hueco:#0f151e; --fondo:none;
  --sombra:0 1px 2px rgba(0,0,0,.5),0 18px 40px -26px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;background:var(--bg)}
/* Un halo azul arriba, que es de donde "sale" la marca, y el fondo se apaga hacia abajo. */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(1100px 520px at 50% -12%,rgba(77,155,255,.16),transparent 68%),
             linear-gradient(180deg,rgba(11,15,23,.86),rgba(11,15,23,.97)),
             var(--fondo) center/cover no-repeat,var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 60px}
header{text-align:center;margin-bottom:18px}
.org{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(24px,5.4vw,38px);font-weight:900;line-height:1.12;letter-spacing:-.4px;margin:6px 0 8px}
h2{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:10px}
h2 .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--accent);color:#fff}
.premio{color:var(--muted);font-size:15px}
.link{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0;
  box-shadow:var(--sombra)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.kpi b{display:block;font-size:clamp(20px,5vw,30px);font-weight:900;letter-spacing:-.5px}
.kpi b.chica{font-size:clamp(14px,3.6vw,18px)}
.kpi span{display:block;font-size:12px;color:var(--muted);line-height:1.25}
.muted{color:var(--muted);font-size:13.5px}
.criterio{margin-top:12px;text-align:center}
.buscar{margin-top:14px}
.buscar input,.entrada{width:100%;background:var(--hueco);color:var(--txt);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:16px;font-family:inherit}
.buscar input:focus,.entrada:focus{outline:2px solid var(--accent);border-color:transparent}
.buscar-res,.res{min-height:22px;margin-top:8px;font-size:14px;font-weight:600}
.ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
.chk{margin-top:12px;font-size:13px;color:var(--muted);word-break:break-all}
.chk code{font-size:11.5px;display:block;margin-top:5px}
.centro{text-align:center}
.cuando .lbl{font-size:14px;color:var(--muted)}
.cuando .lbl b{color:var(--txt)}
.cuando .fecha{font-size:clamp(18px,4.6vw,24px);font-weight:800;margin:4px 0 2px}
.countdown{font-size:15px;color:var(--accent);font-weight:700;min-height:22px;font-variant-numeric:tabular-nums}
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;border:0;margin-top:16px;font-size:20px;font-weight:800;color:#fff;padding:16px 36px;border-radius:15px;min-width:230px;background:linear-gradient(100deg,var(--accent),var(--accent2));box-shadow:0 12px 30px -14px rgba(11,99,214,.9);transition:transform .1s,filter .2s}
.btn-main:hover{filter:brightness(1.08)} .btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.4;cursor:default;filter:grayscale(.5);box-shadow:none}
.nota{margin-top:12px;font-size:13px;color:var(--muted);max-width:520px;margin-left:auto;margin-right:auto}
.estado{margin-top:10px;font-size:14px;min-height:20px;font-weight:600}
.section-lbl{text-align:center;font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin:26px 0 12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tarjeta{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;display:flex;align-items:center;gap:10px;min-height:60px;overflow:hidden}
.tarjeta .rank{flex:none;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);background:var(--hueco)}
.tarjeta .name{font-weight:700;font-size:15px;word-break:break-all}
.tarjeta.spin .name{color:var(--muted);opacity:.7}
.tarjeta.won{animation:pop .45s cubic-bezier(.2,1.3,.5,1)}
.tarjeta.gold{border-color:var(--gold-bd);background:var(--gold-bg)}
.tarjeta.gold .rank{color:#4a3200;background:linear-gradient(100deg,#f5d78a,#e8b143)}
.tarjeta.silver{border-color:var(--silver-bd);background:var(--silver-bg)}
.tarjeta.silver .rank{color:#1f2b3d;background:linear-gradient(100deg,#e3e9f2,#c3cede)}
@keyframes pop{0%{transform:scale(.8);opacity:.4}100%{transform:scale(1);opacity:1}}
.row-k{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.row-k:last-of-type{border-bottom:0}
.row-k>span:first-child{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
/* overflow-wrap y NO word-break: una palabra corta como --forzar no se parte al medio,
   pero una huella de 64 caracteres sigue cortando donde haga falta. */
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;overflow-wrap:anywhere;background:var(--hueco);border:1px solid var(--border);padding:2px 6px;border-radius:6px}
pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--hueco);border:1px solid var(--border);padding:10px 12px;border-radius:9px;overflow-x:auto;margin:8px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn-ghost{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600}
.codigo{margin-top:6px;text-align:center}
.codigo .lbl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.codigo .val{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(15px,3.8vw,22px);font-weight:800;letter-spacing:1px;word-break:break-all;margin:6px 0 4px;color:var(--txt);background:var(--hueco);border:1px solid var(--accent);border-radius:12px;padding:12px 14px}
.codigo .sub{font-size:12.5px;color:var(--muted)}
.lista{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.lista li{background:var(--hueco);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px;display:flex;gap:8px;align-items:center;word-break:break-all}
.lista li .n{flex:none;font-size:12px;color:var(--muted);min-width:18px}
.lista.gold li{border-color:var(--gold-bd);background:var(--gold-bg)} .lista.silver li{border-color:var(--silver-bd);background:var(--silver-bg)}
details.card summary{cursor:pointer;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card summary::after{content:"+";font-size:22px;color:var(--accent);font-weight:400}
details[open].card summary::after{content:"–"}
details.card summary::-webkit-details-marker{display:none}
details .cuerpo{margin-top:12px;font-size:14.5px;color:var(--txt)}
details ol{padding-left:22px} details li{margin:8px 0}
details h4{margin:14px 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
details a{color:var(--accent)}
.banner{border:1px solid var(--gold-bd);background:var(--gold-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13.5px;margin:14px 0}
.banner.err{border-color:#5c2422;background:#1f1211;color:var(--err)}
.banner.ok{border-color:#1f5a41;background:#0e1c17;color:var(--ok)}
footer{margin-top:30px;text-align:center;font-size:12.5px;color:var(--muted)}
.hidden{display:none !important}
.explica{font-size:15.5px;line-height:1.5;color:var(--txt);max-width:560px;margin:0 auto 12px}
.mini{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--accent);padding:2px 8px;border-radius:7px;font-size:12px;font-weight:600;margin-left:4px}
.hcorto{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:var(--txt);letter-spacing:.5px}
.sub-h{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 0 6px}
.anclas{list-style:none;font-size:13.5px}
.anclas li{padding:6px 0;border-bottom:1px solid var(--border)}
.anclas li:last-child{border-bottom:0}
.tarjeta .chica,.lista .chica{font-size:12px;margin-left:auto;white-space:nowrap}
.lista li{flex-wrap:wrap}

/* ---- Identidad de plataforma: barra de marca arriba de todo ---- */
.marca{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 15px;margin-bottom:16px;
  background:var(--card);border:1px solid var(--border);border-radius:13px;
  box-shadow:var(--sombra)}
.marca .logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;letter-spacing:-.2px}
.marca .logo .pin{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;font-size:14px;font-weight:900}
.marca .logo em{font-style:normal;color:var(--muted);font-weight:600}
.marca .sello{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ok);
  border:1px solid #1f5a41;background:#0e1c17;padding:5px 10px;border-radius:999px;white-space:nowrap}
@media (max-width:430px){.marca .sello span{display:none}}

/* ---- Tablero de números ---- */
.tablero{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:9px;margin-bottom:4px}
.dato{background:var(--hueco);border:1px solid var(--border);border-radius:12px;padding:11px 12px;text-align:center}
.dato b{display:block;font-size:clamp(19px,4.4vw,26px);font-weight:900;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.dato b.chica{font-size:clamp(13px,3.2vw,16px);letter-spacing:0}
.dato span{display:block;font-size:11.5px;color:var(--muted);line-height:1.25;margin-top:3px}
.dato.destaca{border-color:#2b4f7d;background:#101d2e}
.dato.destaca b{color:var(--accent)}
.dato a{color:inherit;text-decoration:none}
.dato a:hover{text-decoration:underline}

/* ---- Reparto de likes ---- */
.reparto{margin-top:14px}
.reparto .tit{font-size:12px;color:var(--muted);margin-bottom:8px;text-align:center}
.reparto ol{list-style:none;display:grid;gap:4px}
.reparto li{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.reparto .lk{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.reparto .barra{height:15px;border-radius:5px;background:#1b2432;overflow:hidden}
.reparto .barra i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.reparto li.gana .lk{color:var(--gold);font-weight:800}
.reparto li.gana .barra i{background:linear-gradient(90deg,#e8b143,#c9920f)}
.reparto .cant{color:var(--muted);font-variant-numeric:tabular-nums}


  .paso-t{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:9px}
  .paso-t i{width:21px;height:21px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:#fff;font-style:normal;font-size:12px;flex:none}
  .campo{margin-bottom:13px}
  .campo label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .campo input,.campo select{width:100%;background:var(--hueco);color:var(--txt);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:15px;font-family:inherit}
  .campo input:focus,.campo select:focus{outline:2px solid var(--accent);border-color:transparent}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .reel-fila{display:flex;gap:13px;align-items:center}
  .reel-datos{min-width:0;flex:1}
  /* La miniatura va con un aro de degradé (padding + fondo en el contenedor) y encima un velo
     que la funde con el fondo oscuro por abajo: sin eso el recorte del reel queda como una
     estampilla pegada. El aro es el único lugar de la página con color fuerte. */
  .mini-reel{flex:none;position:relative;display:block;line-height:0;width:84px;padding:2px;
    border:0;border-radius:14px;
    background:linear-gradient(155deg,var(--accent) 0%,#7a4bf0 52%,var(--gold) 100%);
    box-shadow:0 12px 28px -14px rgba(77,155,255,.65)}
  .mini-reel img{width:100%;height:114px;object-fit:cover;display:block;border-radius:12px}
  .mini-reel::after{content:"";position:absolute;inset:2px;border-radius:12px;pointer-events:none;
    background:linear-gradient(180deg,rgba(11,15,23,0) 45%,rgba(11,15,23,.7) 100%)}
  .mini-reel:hover{filter:brightness(1.12)}
  .mini-reel:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .cobertura{border-radius:11px;padding:12px 14px;margin:12px 0;font-size:13.5px;line-height:1.5}
  .cobertura.mal{background:var(--gold-bg);border:1px solid var(--gold-bd);color:var(--warn)}
  .cobertura.bien{background:#0e1c17;border:1px solid #1f5a41;color:var(--ok)}
  .cobertura b{color:inherit}
  .confirmo{display:flex;gap:9px;align-items:flex-start;margin-top:11px;font-size:13.5px;cursor:pointer}
  .confirmo input{margin-top:3px;flex:none;width:17px;height:17px;accent-color:var(--accent)}
  .ruleta{min-height:112px;display:grid;place-items:center;margin:6px 0 2px}
  .ruleta .cara{font-size:clamp(21px,5.6vw,32px);font-weight:900;letter-spacing:-.5px;color:var(--accent);
    font-variant-numeric:tabular-nums;word-break:break-all;text-align:center;padding:0 8px}
  .ruleta.quieta .cara{color:var(--gold)}
  .ganador{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:13px;margin:8px 0;
    background:var(--gold-bg);border:1px solid var(--gold-bd);animation:entra .4s ease both}
  .ganador .pos{width:29px;height:29px;border-radius:9px;background:linear-gradient(100deg,#f5d78a,#e8b143);color:#4a3200;font-weight:900;
    display:grid;place-items:center;font-size:14px;flex:none}
  .ganador .quien{font-weight:800;font-size:17px;word-break:break-all}
  .ganador .det{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ganador.sup{background:var(--silver-bg);border-color:var(--silver-bd)}
  .ganador.sup .pos{background:linear-gradient(100deg,#e3e9f2,#c3cede);color:#1f2b3d}
  .ganador.sup .quien{font-size:15px;font-weight:700}
  @keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.ganador{animation:none}}
  .comentario{font-size:13px;color:var(--muted);font-style:italic;margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .semilla{font-size:11.5px;color:var(--muted);word-break:break-all;margin-top:12px}
  .vacio{text-align:center;color:var(--muted);font-size:14px;padding:22px 10px}

</style>
</head>
<body>

<div class="wrap">
  <div class="marca">
    <div class="logo"><span class="pin">V</span>Vesl <em>Sorteos</em></div>
    <div class="sello" id="selloTop">✓ Sorteo<span> de comentarios</span></div>
  </div>

  <section class="card">
    <div class="paso-t"><i>1</i>El reel</div>
    <div class="reel-fila">
      <a id="miniLink" class="mini-reel" target="_blank" rel="noopener" title="Ver el reel en Instagram">
        <img id="mini" alt="Miniatura del reel" hidden>
      </a>
      <div class="reel-datos">
        <div class="campo" style="margin-bottom:0">
          <label for="reel">Link del reel de Instagram</label>
          <input id="reel" placeholder="https://www.instagram.com/reel/..." autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
    <div id="cobertura"></div>
  </section>

  <section class="card">
    <div class="paso-t"><i>2</i>Los parámetros</div>
    <div class="campo">
      <label for="criterio">¿Cómo se elige?</label>
      <select id="criterio">
        <option value="azar">Al azar entre todos los que comentaron</option>
        <option value="menos">El comentario con MENOS likes</option>
        <option value="mas">El comentario con MÁS likes</option>
      </select>
    </div>
    <div class="fila">
      <div class="campo"><label for="nGan">Ganadores</label><input id="nGan" type="number" min="1" max="50" value="1" inputmode="numeric"></div>
      <div class="campo"><label for="nSup">Suplentes</label><input id="nSup" type="number" min="0" max="50" value="5" inputmode="numeric"></div>
    </div>
    <!-- Viene con el 30/08 puesto porque es lo que se acordo para este sorteo ("los comentarios
         cuentan hasta ayer"). Vacio se olvida: se sorteo una vez sin corte y salio ganador un
         comentario del 31. Se puede borrar o cambiar a mano. -->
    <div class="campo">
      <label for="corte">Los comentarios cuentan hasta</label>
      <input id="corte" type="date" value="2026-08-30">
    </div>
    <!-- El organizador nunca participa. Va fijo y oculto: no es una decisión que se tome
         en cada sorteo, y a la vista solo invita a preguntas. Para cambiarlo, sacar "hidden". -->
    <div class="campo hidden">
      <label for="excluir">Cuentas que no participan, separadas por coma</label>
      <input id="excluir" value="damiancivale" placeholder="usuario1, usuario2" autocomplete="off" spellcheck="false">
    </div>
    <!-- Las respuestas dentro de un hilo NO cuentan: es lo que se anunció y lo que se hizo en el
         sorteo anterior. El control queda acá, oculto, porque el motor lo soporta y algún sorteo
         puede querer lo contrario; para prenderlo se le saca la clase "hidden". -->
    <label class="confirmo hidden" for="respuestas" style="margin:0 0 13px">
      <input type="checkbox" id="respuestas">
      <span>Contar también las respuestas dentro de un hilo. <b id="cuantasResp"></b></span>
    </label>
    <div id="avisoCriterio" class="cobertura mal" hidden></div>
  </section>

  <section class="card centro">
    <div class="ruleta" id="ruleta"><div class="cara" id="cara">—</div></div>
    <button id="go" class="btn-main">Sortear</button>
    <p id="estado" class="estado"></p>
  </section>

  <section class="card hidden" id="cardRes">
    <div class="section-lbl">Ganadores</div>
    <div id="gan"></div>
    <div class="section-lbl hidden" id="supLbl">Suplentes, en orden</div>
    <div id="sup"></div>
    <div class="semilla" id="semilla"></div>
    <div style="text-align:center;margin-top:14px">
      <button id="bajar" class="btn-ghost" type="button">Descargar ganadores</button>
      <p id="avisoBajar" class="muted" style="margin-top:8px" hidden></p>
    </div>
  </section>

  <p class="muted" style="text-align:center;margin-top:18px" id="pie"></p>
</div>

<script>/*
  Sorteo transparente — núcleo del algoritmo.
  El MISMO archivo corre en el navegador (sortear.html / verificar.html) y en Node (verificar.js),
  así cualquiera puede reproducir el resultado con exactamente el mismo código.

  Definiciones exactas (para reproducir sin leer el código):
    usuario   = el string tal cual figura en participantes.json (minúsculas, sin @, solo [a-z0-9._], 1 a 30).
    huella    = SHA-256 (hex) de los bytes UTF-8 de: cada usuario seguido de "\n", concatenados en el orden del archivo.

rq","l":1,"ts":"2026-08-01T03:59:06+0000","id":"18069993182446466","r":1},{"u":"requemarq","l":1,"ts":"2026-08-07T16:47:26+0000","id":"18109879927818800","r":1},{"u":"requemarq","l":1,"ts":"2026-08-18T03:49:43+0000","id":"17885320809655243","r":1},{"u":"requemarq","l":1,"ts":"2026-08-28T02:11:56+0000","id":"17937570414099455","r":1},{"u":"tatti03.salgueiro","l":2,"ts":"2026-08-01T18:20:06+0000","id":"18126852226710339","r":1},{"u":"trigo3377","l":2,"ts":"2026-08-03T05:10:31+0000","id":"18012361658739576","r":1},{"u":"trigo3377","l":2,"ts":"2026-08-07T13:33:52+0000","id":"18629469850022893","r":1},{"u":"damiancivale","l":25,"ts":"2026-08-01T03:42:16+0000","id":"18127246147676709","r":1},{"u":"requemarq","l":1,"ts":"2026-08-27T03:33:25+0000","id":"18622082902004739","r":1},{"u":"damiancivale","l":18,"ts":"2026-08-01T03:10:05+0000","id":"17972286489085261","r":1},{"u":"noelia_loza","l":6,"ts":"2026-08-01T03:11:23+0000","id":"18123749848753567","r":1},{"u":"teveobonita.indumentaria","l":4,"ts":"2026-08-01T05:19:29+0000","id":"17895102039574382","r":1},{"u":"requemarq","l":2,"ts":"2026-08-01T03:08:40+0000","id":"18109305596008951","r":1},{"u":"requemarq","l":2,"ts":"2026-08-01T03:08:59+0000","id":"17879031939682208","r":1},{"u":"requemarq","l":1,"ts":"2026-08-01T03:58:56+0000","id":"18134450185614665","r":1},{"u":"requemarq","l":1,"ts":"2026-08-18T03:50:30+0000","id":"17902726551545703","r":1},{"u":"mihanovich.jorge","l":2,"ts":"2026-08-01T04:17:15+0000","id":"18243566971308981","r":1},{"u":"kalen_45502","l":2,"ts":"2026-08-01T04:24:36+0000","id":"18042753122642575","r":1},{"u":"requemarq","l":1,"ts":"2026-08-20T01:42:32+0000","id":"18112750168812878","r":1},{"u":"damiancivale","l":23,"ts":"2026-08-01T03:09:20+0000","id":"17921715888185088","r":1},{"u":"requemarq","l":1,"ts":"2026-08-25T21:13:58+0000","id":"17942836053072278","r":1},{"u":"requemarq","l":1,"ts":"2026-08-25T21:16:11+0000","id":"18103178621179314","r":1},{"u":"requemarq","l":1,"ts":"2026-08-25T21:20:18+0000","id":"18107054780163534","r":1},{"u":"gaby_denise.c","l":1,"ts":"2026-08-28T02:37:29+0000","id":"17955616869211142","r":1},{"u":"damiancivale","l":28,"ts":"2026-08-01T03:08:27+0000","id":"18214031809344566","r":1},{"u":"davidmingrino","l":6,"ts":"2026-08-01T03:13:29+0000","id":"18095865812342220","r":1},{"u":"requemarq","l":5,"ts":"2026-08-01T03:14:27+0000","id":"18173369089435795","r":1},{"u":"damiancivale","l":3,"ts":"2026-08-01T03:42:46+0000","id":"18144188227530441","r":1},{"u":"requemarq","l":4,"ts":"2026-08-01T03:59:22+0000","id":"18003223124978071","r":1},{"u":"mat_81912madrid","l":2,"ts":"2026-08-01T18:57:03+0000","id":"18130953166713591","r":1},{"u":"natynatalderete","l":3,"ts":"2026-08-01T11:36:25+0000","id":"18110324746804074","r":1},{"u":"nicodadde","l":3,"ts":"2026-08-01T13:09:27+0000","id":"18108441206323511","r":1},{"u":"modesta.cafe","l":3,"ts":"2026-08-01T14:27:13+0000","id":"18027254600679269","r":1},{"u":"amboadegonza","l":2,"ts":"2026-08-26T02:51:09+0000","id":"18407289337083792","r":1},{"u":"natynatalderete","l":3,"ts":"2026-08-26T09:47:00+0000","id":"18100727585247958","r":1},{"u":"damiancivale","l":3,"ts":"2026-08-26T11:58:53+0000","id":"18125871526748573","r":1},{"u":"natynatalderete","l":3,"ts":"2026-08-26T12:01:22+0000","id":"18036659297822372","r":1},{"u":"requemarq","l":2,"ts":"2026-08-28T02:13:01+0000","id":"18223870528334761","r":1},{"u":"amboadegonza","l":2,"ts":"2026-08-31T15:28:28+0000","id":"17965034063965320","r":1},{"u":"moncadakarleidy.19","l":0,"ts":"2026-08-31T22:19:52+0000","id":"18163620058480360","r":1},{"u":"gaby_mansilla__","l":0,"ts":"2026-08-31T22:14:43+0000","id":"18122318852479645","r":1}]};</script>
<script>
(function(){
  "use strict";
  const Core = window.SorteoCore;
  const $ = id => document.getElementById(id);
  const fmtN = n => Number(n).toLocaleString("es-AR");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtF = d => new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(d));
  // Los likes son una foto: siguen cambiando en Instagram despues de bajarlos. Cuando el
  // criterio se decide por likes, la hora de esa foto es parte del resultado.
  const fmtFH = d => new Intl.DateTimeFormat("es-AR",{timeZone:"America/Argentina/Buenos_Aires",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(new Date(d));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  let DATOS = null, sorteando = false, ultimo = null, guardar = null;

  // Sólo existe cuando la página corre dentro del visor de artifacts. Tarda en resolver y puede
  // dar null, así que no se espera: si llega, llega antes de que alguien toque el botón.
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { guardar = d; }).catch(() => {});
  }

  async function cargar(){
    try {
      DATOS = window.__DATOS__;
    } catch(e){
      $("cobertura").innerHTML = '<div class="cobertura mal">No pude cargar los comentarios (' + esc(e.message) + ").</div>";
      return;
    }
    $("reel").value = DATOS.reel || "";
    // La miniatura viaja embebida: la URL que da Instagram está firmada y se vence en horas.
    // En local datos.json no la trae (la embebe armar-publicacion.js), así que se cae al
    // archivo suelto para que el diseño se vea igual acá que publicado.
    $("mini").src = DATOS.miniatura || "miniatura.jpg";
    $("mini").hidden = false;
    $("mini").addEventListener("error", () => { $("miniLink").hidden = true; });
    if (DATOS.reel) $("miniLink").href = DATOS.reel;
    const nresp = DATOS.comentarios.filter(c => c.r).length;
    $("cuantasResp").textContent = nresp ? "Son " + fmtN(nresp) + "." : "";
    if (DATOS.bajado) {
      $("pie").innerHTML = "Vesl Sorteos · comentarios y likes tomados de la API oficial de " +
        "Instagram el <b>" + esc(fmtFH(DATOS.bajado)) + "</b>";
    }
    renderCobertura();
    recalcular();
  }

  // RF-2 y RF-3: los números de cobertura ANTES de habilitar el sorteo.
  function renderCobertura(){
    const c = DATOS.comentarios, fechas = c.map(x => x.ts).sort();
    const masViejo = fechas[0], publicado = DATOS.publicado;
    const incompleto = masViejo && publicado && Date.parse(masViejo) > Date.parse(publicado) + 36e5;
    const decl = DATOS.declarados;
    let html = "";
    if (incompleto) {
      html = '<div class="cobertura mal">Instagram declara <b>' + fmtN(decl) + " comentarios</b> y su API devolvió <b>" +
        fmtN(c.length) + "</b>. El más viejo que entregó es del <b>" + fmtF(masViejo) + "</b>, pero el reel se publicó el " +
        fmtF(publicado) + ": <b>faltan los comentarios de los primeros días</b> y no hay forma de recuperarlos." +
        '<label class="confirmo"><input type="checkbox" id="okIncompleto"><span>Entiendo que el sorteo se hace sobre ' +
        fmtN(c.length) + " comentarios de " + fmtN(decl) + ", y que quien haya comentado antes del " + fmtF(masViejo) +
        " no participa.</span></label></div>";
    } else if (decl) {
      // Va SOLO el número de Instagram, no el nuestro al lado. Los dos juntos invitaban a una
      // resta que la página no puede explicar (son comentarios borrados u ocultos por el filtro,
      // que la API no entrega) y que Instagram mismo no cierra: su API declaraba 4.820 mientras
      // su app mostraba 4.951 el mismo día. El aviso de arriba sí queda: si faltan los primeros
      // días del reel, hay que verlo y confirmarlo antes de sortear.
      html = '<p class="muted" style="margin:10px 0 0">Instagram cuenta <b>' + fmtN(decl) +
        "</b> comentarios en este reel.</p>";
    }
    $("cobertura").innerHTML = html;
    const chk = $("okIncompleto");
    if (chk) chk.addEventListener("change", recalcular);
  }

  function participantes(){
    if (!DATOS) return { lista: [], porUsuario: new Map(), stats: null };
    const excl = new Set(($("excluir").value || "").split(",").map(s => s.trim().replace(/^@+/,"").toLowerCase()).filter(Boolean));
    const corte = $("corte").value ? Date.parse($("corte").value + "T23:59:59-03:00") : null;
    const crit = $("criterio").value;

    let cs = DATOS.comentarios.filter(c => !excl.has(c.u));
    // Las respuestas dentro de un hilo no entran salvo que se pidan: el edge de Instagram las
    // separa, y que cuenten o no cambia el padrón. Se decide acá y se dice en las bases.
    if (!$("respuestas").checked) cs = cs.filter(c => !c.r);
    const antesDelCorte = cs.length;
    if (corte) cs = cs.filter(c => Date.parse(c.ts) <= corte);
    const descartados = antesDelCorte - cs.length;

    const porUsuario = new Map();
    for (const c of cs) {
      const p = porUsuario.get(c.u);
      // Por usuario nos quedamos con su comentario más relevante según el criterio.
      if (!p) { porUsuario.set(c.u, c); continue; }
      if (crit === "menos" && c.l < p.l) porUsuario.set(c.u, c);
      if (crit === "mas" && c.l > p.l) porUsuario.set(c.u, c);
    }
    let lista = [...porUsuario.keys()].sort();
    let enElValor = null, valor = null;
    if (crit !== "azar" && lista.length) {
      const valores = lista.map(u => porUsuario.get(u).l);
      valor = crit === "menos" ? Math.min.apply(null, valores) : Math.max.apply(null, valores);
      const enValor = lista.filter(u => porUsuario.get(u).l === valor);
      enElValor = enValor.length;
    }
    return { lista, porUsuario, descartados, comentarios: cs.length, valor, enElValor, crit };
  }

  function recalcular(){
    if (!DATOS) return;
    const p = participantes();
    // Antes de sortear no se adelanta NADA del resultado: ni cuántos quedaron empatados en el
    // mínimo ni cuántos participan. Adelantarlo convierte al botón en un trámite y hace que el
    // sorteo parezca decidido de antemano, que es justo lo que hay que evitar. La única
    // excepción está abajo: cuando con estos parámetros no se puede sortear, hay que decirlo.

    // RF-13 y RF-15: decir qué va a pasar ANTES de tocar el botón.
    const av = $("avisoCriterio");
    const nGan = Math.max(1, Number($("nGan").value) || 1);
    let msg = "";
    if (!p.lista.length) msg = "No hay nadie participando con estos parámetros.";
    else if (p.lista.length < nGan) msg = "Hay " + fmtN(p.lista.length) + " participante" + (p.lista.length === 1 ? "" : "s") + " y pediste " + nGan + " ganadores.";
    else if (p.crit !== "azar" && p.enElValor <= nGan)
      // Sin dar el número: solo que con estos parámetros el azar no interviene.
      msg = "Con estos parámetros no hace falta sortear: los likes ya deciden el resultado.";
    av.hidden = !msg;
    av.textContent = msg;

    const chk = $("okIncompleto");
    const trabado = (chk && !chk.checked) || !p.lista.length || p.lista.length < nGan;
    $("go").disabled = !!trabado || sorteando;
    $("estado").textContent = chk && !chk.checked ? "Confirmá arriba que entendés qué comentarios faltan." : "";
  }

  async function sortear(){
    if (sorteando) return;
    const p = participantes();
    const nGan = Math.max(1, Number($("nGan").value) || 1);
    const nSup = Math.max(0, Number($("nSup").value) || 0);
    sorteando = true; $("go").disabled = true; $("cardRes").classList.add("hidden");
    $("gan").innerHTML = ""; $("sup").innerHTML = ""; $("supLbl").classList.add("hidden");
    $("ruleta").classList.remove("quieta");

    // El azar sale del navegador, acá y ahora. Se publica junto al resultado para poder rehacerlo.
    const bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
    const semilla = Array.from(bytes, b => b.toString(16).padStart(2,"0")).join("");

    let orden;
    if (p.crit === "azar") {
      orden = (await Core.sortear(p.lista, semilla, nGan, nSup)).orden.map(x => x.usuario);
    } else {
      // Por likes: ordena el recuento y el azar sólo desempata (RF-12 y RF-14).
      const puntajes = await Core.sortear(p.lista, semilla, 0, 0);
      const desempate = new Map(puntajes.orden.map((x,i) => [x.usuario, i]));
      orden = p.lista.slice().sort((a,b) => {
        const la = p.porUsuario.get(a).l, lb = p.porUsuario.get(b).l;
        if (la !== lb) return p.crit === "menos" ? la - lb : lb - la;
        return desempate.get(a) - desempate.get(b);
      });
    }
    const ganadores = orden.slice(0, nGan), suplentes = orden.slice(nGan, nGan + nSup);

    await animar(p.lista, ganadores);
    $("cardRes").classList.remove("hidden");
    for (let i = 0; i < ganadores.length; i++) { pintar($("gan"), ganadores[i], i + 1, p, false); await sleep(430); }
    if (suplentes.length) {
      $("supLbl").classList.remove("hidden");
      for (let i = 0; i < suplentes.length; i++) { pintar($("sup"), suplentes[i], i + 1, p, true); await sleep(230); }
    }
    const cuando = new Date();
    $("semilla").textContent = "Sorteado el " + cuando.toLocaleString("es-AR") +
      " · " + fmtN(p.lista.length) + " participantes · criterio: " +
      ($("criterio").selectedOptions[0].textContent) +
      (p.crit !== "azar" && DATOS.bajado ? " · likes al " + fmtFH(DATOS.bajado) : "") +
      " · semilla " + semilla.slice(0,16) + "…";
    ultimo = { ganadores, suplentes, semilla, p, cuando,
               criterio: $("criterio").selectedOptions[0].textContent, corte: $("corte").value };
    $("cardRes").scrollIntoView({ behavior: "smooth", block: "start" });
    sorteando = false; recalcular();
  }

  // Descarga el resultado como CSV. Va con BOM y punto y coma porque asi lo abre Excel en
  // castellano de un doble clic; con coma parte los acentos y mete todo en una sola columna.
  // Las lineas que arrancan con # son el acta: sin la semilla y el criterio, la lista de
  // ganadores es solo una lista de nombres y no se puede rehacer el sorteo.
  async function bajarGanadores(){
    if (!ultimo) return;
    const u = ultimo, filas = [];
    const q = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
    filas.push("# Sorteo del reel;" + DATOS.reel);
    filas.push("# Sorteado el;" + u.cuando.toLocaleString("es-AR"));
    filas.push("# Criterio;" + u.criterio);
    filas.push("# Comentarios hasta;" + (u.corte ? fmtF(u.corte + "T12:00:00") : "sin corte"));
    if (DATOS.bajado) filas.push("# Likes tomados el;" + fmtFH(DATOS.bajado));
    filas.push("# Personas participando;" + u.p.lista.length);
    filas.push("# Semilla;" + u.semilla);
    filas.push("");
    filas.push(["puesto","tipo","usuario","likes","fecha del comentario","link"].map(q).join(";"));
    const linea = (usuario, i, tipo) => {
      const c = u.p.porUsuario.get(usuario);
      return [i + 1, tipo, "@" + usuario, c ? c.l : "",
              c ? fmtF(c.ts) : "", Core.urlComentario(DATOS.reel, c && c.id) || ""].map(q).join(";");
    };
    u.ganadores.forEach((g, i) => filas.push(linea(g, i, "ganador")));
    u.suplentes.forEach((s, i) => filas.push(linea(s, i, "suplente")));

    const stamp = u.cuando.toISOString().slice(0,16).replace("T","_").replace(":","");
    const nombre = "ganadores_" + stamp + ".csv";
    const texto = "﻿" + filas.join("\r\n") + "\r\n";
    const aviso = $("avisoBajar");
    aviso.hidden = true;

    // Adentro del visor de artifacts, el navegador no deja que la página baje nada por su
    // cuenta: hay que pedírselo al visor, que le muestra al usuario un cartel de confirmación.
    // Publicada como sitio web, esa API no existe y se usa el <a download> de toda la vida.
    if (guardar) {
      try {
        await guardar.save({ filename: nombre, data: texto });
      } catch (e) {
        const code = e && e.code;
        if (code && code !== "declined") {
          aviso.textContent = "No se pudo descargar (" + code + ").";
          aviso.hidden = false;
        }
      }
      return;
    }

    const blob = new Blob([texto], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // Ruleta: nombres al azar cada vez más lento hasta frenar en el ganador.
  async function animar(lista, ganadores){
    const cara = $("cara"), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || lista.length < 2) { cara.textContent = "@" + ganadores[0]; $("ruleta").classList.add("quieta"); return; }
    let espera = 45;
    const hasta = Date.now() + 2600;
    while (Date.now() < hasta) {
      cara.textContent = "@" + lista[Math.floor(Math.random() * lista.length)];
      await sleep(espera);
      if (Date.now() > hasta - 1100) espera = Math.min(300, espera * 1.28);
    }
    cara.textContent = "@" + ganadores[0];
    $("ruleta").classList.add("quieta");
    await sleep(320);
  }

  function pintar(cont, usuario, pos, p, esSup){
    const c = p.porUsuario.get(usuario);
    const url = Core.urlComentario(DATOS.reel, c && c.id);
    const det = c ? (fmtN(c.l) + " like" + (c.l === 1 ? "" : "s") + " · " + fmtF(c.ts)) : "";
    const d = document.createElement("div");
    d.className = "ganador" + (esSup ? " sup" : "");
    d.innerHTML = '<div class="pos">' + pos + '</div><div style="min-width:0"><div class="quien">@' + esc(usuario) + "</div>" +
      '<div class="det">' + esc(det) + (url ? ' · <a class="link" href="' + esc(url) + '" target="_blank" rel="noopener">ver comentario</a>' : "") + "</div>" +
      (c && c.t ? '<div class="comentario">' + esc(c.t) + "</div>" : "") + "</div>";
    cont.appendChild(d);
  }

  ["criterio","nGan","nSup","corte","excluir","respuestas"].forEach(id => {
    $(id).addEventListener("input", recalcular);
    $(id).addEventListener("change", recalcular);
  });
  $("go").addEventListener("click", sortear);
  $("bajar").addEventListener("click", bajarGanadores);
  $("pie").innerHTML = "Vesl Sorteos · los comentarios los trae la API oficial de Instagram";
  cargar();
})();
</script>
